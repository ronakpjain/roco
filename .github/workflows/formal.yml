name: SoC formal verification

on:
  push:
    branches: [main, "ci/**"]
    paths:
      - "soc/**"
      - "cc/**"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "soc/**"
      - "cc/**"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soc-formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.job }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {job: bridge, mode: prove}
          - {job: xbar, mode: prove}
          - {job: icache, mode: prove, solver: bitwuzla}
          - {job: if-cache, mode: prove, solver: bitwuzla}
          - {job: sv32, mode: prove, solver: bitwuzla}
          - {job: core-accounting, mode: prove, riscv-formal: true}
          - {job: core-gpr-writeback, mode: prove, riscv-formal: true}
          - {job: core-no-divide, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: core-forward, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: core-isa, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: core-isa-stall, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: csr-trap, mode: prove}
          - {job: core-irq, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: divider, mode: prove}
          - {job: core-m-stream, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: atomic-mem, mode: prove}
          - {job: core-atomic-stream, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: core-vector-mem-stream, mode: prove, riscv-formal: true, solver: bitwuzla}
          - {job: scalar-regs, mode: prove}
          - {job: vector-regs, mode: prove}
          - {job: vector-execute, mode: prove, solver: bitwuzla}
          - {job: mul-prod, mode: prove}
          - {job: mul-recombine, mode: prove}
          - {job: core, mode: bmc-fast, depth: 9, riscv-formal: true}
          - {job: core-gpr, mode: bmc-fast, depth: 12, riscv-formal: true}
          - {job: core-memory-port, mode: bmc-fast, depth: 11, riscv-formal: true}
          - {job: core-atomic, mode: bmc-fast, depth: 12, riscv-formal: true}
          - {job: core-vector-copy, mode: bmc-fast, depth: 20}
          - {job: core-divide-cutpoint, mode: bmc-fast, depth: 45}
          - {job: core-divide-interlock, mode: bmc, depth: 45, solver: bitwuzla}
          - {job: core-csr-trap, mode: bmc-fast, depth: 48}
          - {job: core-sv32-load, mode: bmc-fast, depth: 55}
          - {job: core-vector-mem-stream, mode: bmc-fast, depth: 24, riscv-formal: true, proof-timeout: 600}
          - {job: axi-mem-master, mode: prove}
          - {job: sdram-adapter, mode: prove, solver: bitwuzla}
          - {job: sdram-pins, mode: prove, solver: bitwuzla}
          - {job: sdram-link, mode: prove, solver: bitwuzla}
          - {job: sdram-memory, mode: prove, solver: bitwuzla}
          - {job: dcache-memory, mode: prove, solver: bitwuzla}
          - {job: soc-control, mode: prove, solver: bitwuzla}
          - {job: soc-fence, mode: prove, solver: bitwuzla}
          - {job: soc-ram, mode: prove, solver: bitwuzla}
          - {job: soc-sdram-memory, mode: prove, solver: bitwuzla}
          - {job: soc-mmio-memory, mode: bmc-fast, depth: 422, solver: bitwuzla}
    env:
      OSS_CAD_SUITE_VERSION: "2026-11-16"
      RISCV_FORMAL_DIR: third_party/riscv-formal
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out riscv-formal reference
        if: matrix.riscv-formal
        uses: actions/checkout@v5
        with:
          repository: YosysHQ/riscv-formal
          ref: c992aa61fdfe0846c5ed90324c596202a1c69b76
          path: soc/third_party/riscv-formal
          persist-credentials: false

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.mode }}
        shell: bash
        working-directory: soc
        env:
          JOB: ${{ matrix.job }}
          MODE: ${{ matrix.mode }}
          DEPTH: ${{ matrix.depth }}
          SOLVER: ${{ matrix.solver }}
          PROOF_TIMEOUT: ${{ matrix.proof-timeout }}
        run: |
          yosys -V
          sby --version
          z3 --version
          bash formal/run.sh "$JOB" "$MODE" 2>&1 | tee "$RUNNER_TEMP/formal.log"

      - name: Upload solver log and counterexamples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-${{ matrix.job }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/formal.log
            soc/build/formal/**/*.vcd
          if-no-files-found: ignore
          retention-days: 14

  regress:
    name: Regression (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # test_boot includes cold boot, parser restart and two-image reload.
        target: [test_core, test_soc, test_boot, test_dcache]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install simulation and compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator iverilog cmake ninja-build libgtest-dev

      - name: Build the roco toolchain
        run: |
          cmake -S cc -B cc/build -G Ninja -DROCO_BUILD_DOCS=OFF
          cmake --build cc/build --target roco_as roco_ld roco_cc --parallel 2

      - name: Run ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          make -C soc "$TARGET" 2>&1 | tee "$RUNNER_TEMP/regression.log"

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.target }}
          path: ${{ runner.temp }}/regression.log
          if-no-files-found: ignore
          retention-days: 14
